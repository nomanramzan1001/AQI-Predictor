# =============================================================================
# Training Pipeline — daily model training and Hopsworks Model Registry upload
# =============================================================================
# Script: training_pipeline.py
# Trains sklearn models, selects best by R², saves metrics.json + best_model.pkl
# Schedule: once per day at 06:00 UTC
# Manual run: Actions tab → Train Pipeline → Run workflow
#
# Required GitHub Secrets:
#   HOPSWORKS_API_KEY
#   HOPSWORKS_PROJECT_NAME
#   EATURE_GROUP_NAME
#   FEATURE_GROUP_VERSION
# =============================================================================

name: Train Pipeline

on:
  # Run once daily at 06:00 UTC
  schedule:
    - cron: "0 6 * * *"

  workflow_dispatch:

# Skip duplicate daily runs on the same branch; do not cancel an in-flight training job
concurrency:
  group: train-pipeline-${{ github.ref }}
  cancel-in-progress: false

jobs:
  train-model:
    name: Train and register AQI model
    runs-on: ubuntu-latest
    timeout-minutes: 60

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Upgrade pip and install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-explain.txt

      - name: Validate required secrets
        env:
          HOPSWORKS_API_KEY: ${{ secrets.HOPSWORKS_API_KEY }}
          HOPSWORKS_PROJECT_NAME: ${{ secrets.HOPSWORKS_PROJECT_NAME }}
          FEATURE_GROUP_NAME: ${{ secrets.FEATURE_GROUP_NAME }}
          FEATURE_GROUP_VERSION: ${{ secrets.FEATURE_GROUP_VERSION }}
        run: |
          set -euo pipefail
          missing=0
          if [ -z "${HOPSWORKS_API_KEY:-}" ]; then
            echo "::error::GitHub secret HOPSWORKS_API_KEY is not set."
            missing=1
          fi
          if [ -z "${HOPSWORKS_PROJECT_NAME:-}" ]; then
            echo "::error::GitHub secret HOPSWORKS_PROJECT_NAME is not set."
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
          echo "Required secrets are present."

      # Verify the training script exists (training_pipeline.py in this repo)
      - name: Verify training script
        run: |
          set -euo pipefail
          if [ ! -f "training_pipeline.py" ]; then
            echo "::error::Expected training_pipeline.py at repository root."
            exit 1
          fi
          echo "Using training_pipeline.py"

      - name: Run training_pipeline.py
        env:
          HOPSWORKS_API_KEY: ${{ secrets.HOPSWORKS_API_KEY }}
          HOPSWORKS_PROJECT_NAME: ${{ secrets.HOPSWORKS_PROJECT_NAME }}
          FEATURE_GROUP_NAME: ${{ secrets.FEATURE_GROUP_NAME }}
          FEATURE_GROUP_VERSION: ${{ secrets.FEATURE_GROUP_VERSION }}
        run: |
          set -euo pipefail
          [ -n "${{ secrets.FEATURE_GROUP_NAME }}" ] && export FEATURE_GROUP_NAME="${{ secrets.FEATURE_GROUP_NAME }}"
          [ -n "${{ secrets.FEATURE_GROUP_VERSION }}" ] && export FEATURE_GROUP_VERSION="${{ secrets.FEATURE_GROUP_VERSION }}"
          python training_pipeline.py

      - name: Upload trained model artifacts
        if: always() && hashFiles('model/best_model.pkl') != ''
        uses: actions/upload-artifact@v4
        with:
          name: trained-model-${{ github.run_id }}
          path: |
            model/best_model.pkl
            model/metrics.json
          retention-days: 7

      # Optional: surface metrics summary in the Actions log (artifact not persisted on runner)
      - name: Print training metrics summary
        if: success() && hashFiles('model/metrics.json') != ''
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("model/metrics.json")
          if not path.exists():
              print("No metrics.json produced.")
              raise SystemExit(0)

          data = json.loads(path.read_text(encoding="utf-8"))
          best = data["models"][data["best_model"]]
          print("Best model:", data["best_display_name"])
          print("  R²:", best["r2"], f"({best['r2_pct']}%)")
          print("  RMSE:", best["rmse"])
          print("  MAE:", best["mae"])
          PY